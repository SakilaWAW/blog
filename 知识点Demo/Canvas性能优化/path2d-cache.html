<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>Path2D 缓存复杂路径</title>
<style>canvas{border:1px solid #ddd;}</style>
<body>
<h2>Path2D 缓存复杂路径：对比基准与优化并显示指标</h2>
<div>
  <button id="modeBaseline">基准：每帧重建路径</button>
  <button id="modeOptimized">优化：复用缓存 Path2D</button>
  <span id="stats">FPS: -, 帧时: -, 操作: -</span>
</div>
<canvas id="c" width="600" height="300"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// 复杂星形路径缓存
function makeStar(cx, cy, spikes, outerR, innerR) {
  const p = new Path2D();
  let rot = Math.PI / 2 * 3;
  let x = cx, y = cy;
  const step = Math.PI / spikes;
  p.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerR; y = cy + Math.sin(rot) * outerR; p.lineTo(x, y); rot += step;
    x = cx + Math.cos(rot) * innerR; y = cy + Math.sin(rot) * innerR; p.lineTo(x, y); rot += step;
  }
  p.closePath();
  return p;
}

let mode = 'optimized';
document.getElementById('modeBaseline').onclick = ()=> mode = 'baseline';
document.getElementById('modeOptimized').onclick = ()=> mode = 'optimized';

const stars = Array.from({length: 40}, (_,i)=>({
  x: Math.random()*560+20,
  y: Math.random()*260+20,
  vx: (Math.random()*2-1)*1.5,
  vy: (Math.random()*2-1)*1.5,
  p: makeStar(0,0,5,10+Math.random()*8,5+Math.random()*4),
  color: `hsl(${i*9%360},70%,50%)`
}));

function loop(){
  const t0 = performance.now();
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,c.width,c.height);
  let ops = 0;
  for (const s of stars){
    s.x += s.vx; s.y += s.vy;
    if (s.x < 20 || s.x > c.width-20) s.vx *= -1;
    if (s.y < 20 || s.y > c.height-20) s.vy *= -1;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = s.color;
    if (mode==='baseline') {
      const p = makeStar(0,0,5,10,5);
      ctx.fill(p); ops++;
    } else {
      ctx.fill(s.p); ops++;
    }
    ctx.restore();
  }
  const dt = performance.now()-t0;
  update(dt, ops);
}
const times=[]; const statsEl=document.getElementById('stats');
function update(dt, ops){ times.push(dt); if (times.length>60) times.shift(); const avg=times.reduce((a,b)=>a+b,0)/times.length; const fps=(1000/avg).toFixed(1); statsEl.textContent = `FPS: ${fps}, 帧时: ${avg.toFixed(1)}ms, 操作: ${ops}`; }
loop();
</script>
</body>
</html>
